events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable sendfile
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Keepalive timeout
    keepalive_timeout  65;

    # Gzip compression
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/json application/javascript text/css application/xml text/xml;

    map $http_user_agent $is_bot {
        default 0;
        "~*googlebot" 1;
        "~*bingbot" 1;
        "~*yandex" 1;
        "~*baiduspider" 1;
        "~*facebookexternalhit" 1;
        "~*twitterbot" 1;
        "~*rogerbot" 1;
        "~*linkedinbot" 1;
        "~*embedly" 1;
        "~*quora link preview" 1;
        "~*showyoubot" 1;
        "~*outbrain" 1;
        "~*pinterest" 1;
        "~*slackbot" 1;
        "~*vkShare" 1;
        "~*W3C_Validator" 1;
        "~*redditbot" 1;
        "~*applebot" 1;
        "~*whatsapp" 1;
        "~*flipboard" 1;
        "~*tumblr" 1;
        "~*bitlybot" 1;
        "~*skypeuripreview" 1;
        "~*nuzzel" 1;
        "~*discordbot" 1;
        "~*qwantify" 1;
        "~*pinterestbot" 1;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # Serve static files with proper caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Handle known static file extensions - return 404 if not found
        location ~* \.(php|asp|aspx|jsp|cgi|exe|dll)$ {
            return 404;
        }

        # SPA routing - serve index.html for all non-file requests
        location / {
            index index.html index.htm;

            # For bots, serve static 404 page when the file doesn't exist
            # This returns proper 404 status code for search engines
            try_files $uri $uri/ @bot_or_spa;
        }

        # Named location to handle bot vs SPA routing
        location @bot_or_spa {
            # If it's a bot, return static 404 page with 404 status
            if ($is_bot = 1) {
                return 404;
            }

            # For regular users, serve index.html (SPA routing)
            # React Router will show 404 component but return 200 status
            rewrite ^ /index.html break;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy uploads requests to backend
        location /uploads/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Cache static files
            proxy_cache_valid 200 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}