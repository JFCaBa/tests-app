version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: test-app-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: test-app-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/test-app
      - JWT_SECRET=supersecretjwtkeychangeme
      - CORS_ORIGIN=*
      - UPLOAD_PATH=/app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - app-network
    command: ["npm", "run", "start"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: test-app-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongodb_data:
    driver: local
  uploads:
    driver: local

networks:
  app-network:
    driver: bridge