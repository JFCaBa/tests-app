version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: russian-backend:latest
    container_name: russian-backend
    restart: always
    ports:
      - "1999:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:password@test-app-mongodb:27017/test-app?authSource=admin
      - JWT_SECRET=supersecretjwtkeychangeme
      - CORS_ORIGIN=*
      - UPLOAD_PATH=/app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - app-network
      - repo_app-network
    command: ["npm", "run", "start"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: russian-frontend:latest
    container_name: russian-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  uploads:
    driver: local

networks:
  app-network:
    name: russian-app-network
    driver: bridge
  repo_app-network:
    external: true